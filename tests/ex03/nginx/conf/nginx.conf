server {

	listen 443 ssl;
	listen [::]:443 ssl;

	# Set server name
	server_name ehossain.42.fr www.ehossain.42.fr;

	# Set certificate and key
	ssl_certificate_key /etc/nginx/ssl/server.key;
	ssl_certificate /etc/nginx/ssl/server.crt;
	ssl_protocols TLSv1.3;

	root /var/www/html/;
	index index.html;
}
