<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inception</title>
</head>

<body>

    <center>
        <h1>Welcome to Inception</h1>

        <h2>42 School Project</h2>

        <p>
            This website is running inside a Docker container.
        </p>

        <p>
            The infrastructure is built using Docker Compose.
        </p>

        <hr>

        <h3>Services</h3>

        <p>NGINX</p>
        <!-- <p>WordPress</p> -->
        <p>MariaDB</p>

        <hr>

        <p>
            Inception Project - 42
        </p>
    <h2>Data from MariaDB:</h2>
    <div id="data-container">Loading data...</div>

    <script>
        // Call your backend API container (running on port 5000)
        fetch('http://localhost:5000/api/users')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('data-container');
                container.innerHTML = JSON.stringify(data);
            })
            .catch(err => {
                document.getElementById('data-container').innerText = 'Error loading data';
                console.error(err);
            });
    </script>

    </center>

</body>
</html>
