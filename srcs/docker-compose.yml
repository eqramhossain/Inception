name: Inception

secrets:
  db_password:
   file: ../secrets/db_password.txt
  wp_admin_password:
   file: ../secrets/wp_admin_password.txt
  wp_user_password:
   file: ../secrets/wp_user_password.txt

networks:
  inception_network:
   name: inception_network

volumes:
  database_files:
   name: database_files
   driver: local
   driver_opts:
    type: none
    o: bind
    device: /home/ehossain/data/database_files

  website_files:
   name: website_files
   driver: local
   driver_opts:
    type: none
    o: bind
    device: /home/ehossain/data/website_files

services:
 mariadb:
  build: ./requirements/mairadb
  image: mariadb:inception
  container_name: mariadb
  volumes:
   - database_files:/var/lib/mysql/
  networks: 
   - inception_network
  env_file: .env
  restart: on-failure
  secrets: 
   - db_password

 wordpress:
  depends_on: 
   - mariadb
  build: ./requirements/wordpress
  image: wordpress:inception
  container_name: wordpress
  volumes:
   - website_files:/var/www/html
  networks: 
   - inception_network
  env_file: .env
  restart: on-failure
  secrets: 
   - db_password
   - wp_admin_password
   - wp_user_password

 nginx:
  depends_on: 
   - wordpress
  build: ./requirements/ngnix
  image: nginx:inception
  container_name: nginx
  volumes:
   - website_files:/var/www/html
  networks: 
   - inception_network
  ports: 
   - 443:443
  restart: on-failure
