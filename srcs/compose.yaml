name: Inception

services:
 mariadb:
  build: ./requirements/mairadb
  image: mariadb:Inception
  container_name: mariadb
  volumes:
   - database_files:/var/lib/mysql/
  networks: 
   - Inception_network
  env_file: .env
  restart: on-failure
  secrets: 
   - db_password

 wordpress:
  depends_on: 
   - mariadb
  build: ./requirements/wordpress
  image: wordpress:Inception
  container_name: wordpress
  volumes:
   - website_files:/var/www/html
  networks: 
   - Inception_network
  env_file: .env
  restart: on-failure
  secrets: 
   - db_password
   - wp_admin_password

 nginx:
  depends_on: 
   - wordpress
  build: ./requirements/ngnix
  image: nginx:Inception
  container_name: nginx
  volumes:
   - website_files:/var/www/html
  networks: 
   - Inception_network
  env_file: .env
  ports: 
   - 443:443
  restart: on-failure

volumes:
  database_files:
   driver: local
   driver_opts:
    type: none
    o: bind
    device: /home/ehossain/data/database_files

  website_files:
   driver: local
   driver_opts:
    type: none
    o: bind
    device: /home/ehossain/data/website_files

networks:
  Inception_network:

secrets:
  db_password:
   file: ../secrets/db_password.txt
  wp_admin_password:
   file: ../secrets/wp_admin_password.txt
